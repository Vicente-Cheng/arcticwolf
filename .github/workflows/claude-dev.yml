name: Claude Dev

# Dev agent: implements the approved plan on claude/issue-<N> and opens a
# PR. Triggered when a maintainer adds the `plan-approved` label.

on:
  issues:
    types: [labeled]

# Pin gh to the repo running the workflow; in a fork, gh may otherwise
# resolve to the parent repo.
env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: claude-dev-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Adding a label already needs triage access, and the action itself
    # rejects actors without write permission.
    if: >-
      github.event.label.name == 'plan-approved' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Pushes must use the action's Claude App token, not GITHUB_TOKEN:
          # pushes and PRs made with GITHUB_TOKEN do not trigger CI.
          persist-credentials: false

      - name: Refuse if a branch for this issue already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/claude%2Fissue-${{ github.event.issue.number }}" --silent 2>/dev/null; then
            echo "::error::claude/issue-${{ github.event.issue.number }} already exists; delete it or continue on the existing PR."
            exit 1
          fi

      - name: Create work branch
        run: git switch -c "claude/issue-${{ github.event.issue.number }}"

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run dev agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.issue.number }}
            BRANCH: claude/issue-${{ github.event.issue.number }}
            BASE: ${{ github.event.repository.default_branch }}

            Read .github/claude/dev-agent.md and follow its "Implementing"
            section for this issue.
          claude_args: >-
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(make lint),Bash(make test),Bash(make build),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin HEAD),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)"
